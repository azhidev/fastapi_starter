services:
  migrate:
    image: fastapi-starter:local
    build:
      context: .
    env_file:
      - .env
    network_mode: host
    command: ["aerich", "upgrade"]
    restart: "no"

  api:
    image: fastapi-starter:local
    build:
      context: .
    init: true
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: ${APP_PORT:-8000}
    network_mode: host
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen(f\"http://127.0.0.1:{os.environ['PORT']}/\", timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
